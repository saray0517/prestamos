<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Préstamos - Pascual Bravo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="loan-container">
  <h1 class="main-title">Sistema de préstamos</h1>

  <div class="form-section">
    <h3>1. Datos del Cliente y Solicitud</h3>
    
    <div class="grid-form">
      <div>
        <label class="form-label" for="client-id">Cédula:</label>
        <input type="text" id="client-id" class="form-input" placeholder="Ej: 10203040">
      </div>
      <div>
        <label class="form-label" for="first-name">Nombre:</label>
        <input type="text" id="first-name" class="form-input" placeholder="Ej: Saray">
      </div>
      <div>
        <label class="form-label" for="last-name">Apellido:</label>
        <input type="text" id="last-name" class="form-input" placeholder="Ej: Muñoz">
      </div>
      <div>
        <label class="form-label" for="address">Dirección:</label>
        <input type="text" id="address" class="form-input" placeholder="Ej: Calle 10 #20-30">
      </div>
    </div>

    <label class="form-label" for="monthly-income">Ingreso Mensual ($):</label>
    <input type="text" id="monthly-income" class="form-input" placeholder="Ej: 2.000.000">

    <label class="form-label" for="requested-amount">Monto Solicitado ($):</label>
    <input type="text" id="requested-amount" class="form-input" placeholder="Ej: 10.000.000">

    <label class="form-label" for="installments-count">Número de Cuotas (1 a 60):</label>
    <input type="number" id="installments-count" class="form-input" min="1" max="60" placeholder="Ej: 24">

    <button class="action-button" onclick="requestLoan()">Solicitar Préstamo</button>
  </div>

  <div id="details-section" class="form-section hidden">
    <h3>Detalles del Préstamo Activo</h3>
    <div class="status-card">
      <p><strong>Cliente:</strong> <span id="display-client-name"></span></p>
      <p><strong>Cédula:</strong> <span id="display-client-id"></span></p>
      <p><strong>Monto Solicitado:</strong> $<span id="display-amount">0</span></p>
      <p><strong>Cuotas:</strong> <span id="display-installments">0</span></p>
      <p><strong>Valor por Cuota:</strong> $<span id="display-installment-value">0</span></p>
      <p><strong>Saldo Pendiente:</strong> $<span id="display-remaining-balance">0</span></p>
      <p><strong>En Mora:</strong> <span id="display-overdue-status">No</span></p>
    </div>
  </div>

  <div class="form-section">
    <h3>2. Registrar Pago</h3>
    <label class="form-label" for="payment-client-id">Cédula del Cliente:</label>
    <input type="text" id="payment-client-id" class="form-input" placeholder="Ingrese cédula para pagar">

    <label class="form-label" for="payment-amount">Monto a Pagar ($):</label>
    <input type="text" id="payment-amount" class="form-input" placeholder="Ej: 500.000">
    
    <label class="checkbox-label">
      <input type="checkbox" id="overdue-checkbox"> ¿Simular pago fuera de fecha (Mora)?
    </label>

    <button class="action-button" onclick="processPayment()">Abonar / Pagar</button>
  </div>

  <p id="system-message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
